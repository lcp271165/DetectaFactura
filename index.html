<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Captura de Facturas OCR</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body class="bg-gray-50 min-h-screen font-sans text-gray-800">
    <div class="max-w-md mx-auto bg-white min-h-screen shadow-lg flex flex-col">
        <!-- Header -->
        <header class="bg-blue-600 text-white p-4 shadow-md flex items-center justify-between">
            <h1 class="text-xl font-bold flex items-center gap-2">
                <i data-lucide="receipt"></i> Smart Invoice
            </h1>
        </header>

        <!-- Main Content -->
        <main class="flex-1 p-6 flex flex-col gap-6">

            <!-- Camera Input -->
            <div class="flex flex-col items-center justify-center w-full">
                <label for="cameraInput"
                    class="flex flex-col items-center justify-center w-full h-48 border-2 border-blue-300 border-dashed rounded-xl cursor-pointer bg-blue-50 hover:bg-blue-100 transition-colors">
                    <div class="flex flex-col items-center justify-center pt-5 pb-6">
                        <i data-lucide="camera" class="w-10 h-10 text-blue-500 mb-3"></i>
                        <p class="mb-2 text-sm text-gray-500 font-semibold">Toca para tomar foto</p>
                        <p class="text-xs text-gray-400">Solo imágenes (JPEG, PNG)</p>
                    </div>
                    <!-- 'capture="environment"' abre la cámara trasera en móviles -->
                    <input id="cameraInput" type="file" accept="image/*" capture="environment" class="hidden" />
                </label>
            </div>

            <!-- Image Preview -->
            <div id="previewContainer" class="hidden flex flex-col items-center gap-4">
                <img id="imagePreview" class="max-h-64 rounded-lg shadow-sm border border-gray-200"
                    alt="Vista previa de factura" />
                <button id="processBtn"
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg flex items-center justify-center gap-2 transition-colors">
                    <i data-lucide="scan-line"></i> Extraer Datos
                </button>
            </div>

            <!-- Loading State -->
            <div id="loadingState" class="hidden flex flex-col items-center justify-center py-8">
                <i data-lucide="loader-2" class="w-8 h-8 text-blue-600 animate-spin mb-4"></i>
                <p id="loadingText" class="text-sm text-gray-600 font-medium">Analizando imagen con IA...</p>
            </div>

            <!-- Result Form -->
            <form id="resultForm" class="hidden flex flex-col gap-4 bg-gray-50 p-4 rounded-xl border border-gray-200">
                <h3 class="font-bold text-gray-700 border-b pb-2 mb-2">Datos Extraídos</h3>

                <div>
                    <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Proveedor</label>
                    <input type="text" id="provName"
                        class="w-full p-2 border rounded-md focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Fecha</label>
                    <input type="date" id="invDate"
                        class="w-full p-2 border rounded-md focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div class="flex gap-4">
                    <div class="flex-1">
                        <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Impuesto</label>
                        <input type="number" step="0.01" id="invTax"
                            class="w-full p-2 border rounded-md focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                    <div class="flex-1">
                        <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Total</label>
                        <input type="number" step="0.01" id="invTotal"
                            class="w-full p-2 border rounded-md focus:ring-2 focus:ring-blue-500 outline-none font-bold text-blue-700">
                    </div>
                </div>

                <button type="submit" id="saveBtn"
                    class="mt-4 w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-4 rounded-lg flex items-center justify-center gap-2 transition-colors">
                    <i data-lucide="save"></i> Guardar en Excel / Sheets
                </button>
            </form>

        </main>
    </div>

    <script>
        // Inicializar iconos
        lucide.createIcons();

        // Referencias DOM
        const cameraInput = document.getElementById('cameraInput');
        const previewContainer = document.getElementById('previewContainer');
        const imagePreview = document.getElementById('imagePreview');
        const processBtn = document.getElementById('processBtn');
        const loadingState = document.getElementById('loadingState');
        const loadingText = document.getElementById('loadingText');
        const resultForm = document.getElementById('resultForm');

        let base64Image = null;

        // Validaciones: Compatibilidad de navegador (ES6)
        if (!window.File || !window.FileReader || !window.FileList || !window.Blob) {
            alert('Tu navegador no soporta las APIs necesarias para esta aplicación.');
        }

        // Manejo de la selección de imagen
        cameraInput.addEventListener('change', function (e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function (event) {
                    imagePreview.src = event.target.result;
                    previewContainer.classList.remove('hidden');
                    resultForm.classList.add('hidden');

                    // Extraer solo el string base64 sin el prefijo "data:image/jpeg;base64,"
                    base64Image = event.target.result.split(',')[1];
                }
                reader.readAsDataURL(file);
            }
        });

        // Procesamiento con Gemini API
        processBtn.addEventListener('click', async () => {
            if (!base64Image) return;

            previewContainer.classList.add('hidden');
            loadingState.classList.remove('hidden');
            loadingText.textContent = "Extrayendo datos de la factura...";

            // API Key inyectada por el entorno (o reemplazada en producción)
            const apiKey = "";
            const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;

            const prompt = `Analiza la imagen de esta factura o recibo. Extrae la siguiente información y devuélvela ESTRICTAMENTE en formato JSON:
            {
                "documento": "Número de documento del recibo o factura",
                "fecha": "Fecha de emisión en formato YYYY-MM-DD",
                "concepto": "según los artículos comprados, definir un rubro de la compra",
                "ruc": "RUC de la empresa o persona que emite",
                "proveedor": "Nombre de la empresa o persona que emite",
                "subtotal": "Monto del subtotal (solo número, usar punto decimal)",
                "impuesto": "Monto del igv o impuesto (solo número, usar punto decimal)",
                "total": "Monto total a pagar (solo número, usar punto decimal)"
            }
            Si algún dato no se encuentra, devuelve null para ese campo. No incluyas markdown, solo el JSON puro.`;

            const payload = {
                contents: [{
                    parts: [
                        { text: prompt },
                        { inlineData: { mimeType: "image/jpeg", data: base64Image } }
                    ]
                }],
                generationConfig: {
                    responseMimeType: "application/json"
                }
            };

            try {
                // Implementación de Exponential Backoff recomendada para producción omitida por simplicidad en UI,
                // pero obligatoria en el wrapper de la API real.
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) throw new Error('Fallo en la comunicación con la IA');

                const data = await response.json();
                const extractedText = data.candidates?.[0]?.content?.parts?.[0]?.text;

                if (extractedText) {
                    const extractedData = JSON.parse(extractedText);

                    // Llenar formulario
                    document.getElementById('docNumber').value = extractedData.documento || '';
                    document.getElementById('provName').value = extractedData.proveedor || '';
                    document.getElementById('invDate').value = extractedData.fecha || '';
                    document.getElementById('concept').value = extractedData.concepto || '';
                    document.getElementById('invTax').value = extractedData.impuesto || '';
                    document.getElementById('invTotal').value = extractedData.total || '';

                    loadingState.classList.add('hidden');
                    resultForm.classList.remove('hidden');
                }

            } catch (error) {
                console.error('Error (RCA):', error);
                loadingState.classList.add('hidden');
                previewContainer.classList.remove('hidden');
                alert('Error al procesar la imagen. Revisa la consola o intenta de nuevo.');
            }
        });

        // Enviar datos a Google Sheets
        resultForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const btn = document.getElementById('saveBtn');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i data-lucide="loader-2" class="animate-spin"></i> Guardando...';
            btn.disabled = true;

            const payload = {
                proveedor: document.getElementById('provName').value,
                fecha: document.getElementById('invDate').value,
                impuesto: document.getElementById('invTax').value,
                total: document.getElementById('invTotal').value
            };

            // Aquí debes colocar la URL del Web App de Google Apps Script
            const GOOGLE_SCRIPTS_URL = "https://script.google.com/macros/s/AKfycbwCIYm_rYaPcMgk928MMReqvv9pk3jNfYqGaByAR1JA9Vm-AqLDfeval6wO2bhRQSc/exec";

            try {
                /*
                // Código real de envío (Comentado para que el preview no falle sin URL)
                const response = await fetch(GOOGLE_SCRIPTS_URL, {
                    method: 'POST',
                    mode: 'no-cors', // Evita problemas de CORS al enviar a G-Script
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                */

                // Simulación de delay de red
                await new Promise(resolve => setTimeout(resolve, 1000));

                alert('¡Factura guardada correctamente en la hoja de cálculo!');

                // Reset form
                resultForm.reset();
                resultForm.classList.add('hidden');
                cameraInput.value = '';
                base64Image = null;

            } catch (error) {
                console.error("Error al guardar:", error);
                alert("Error de red al intentar guardar en la hoja de cálculo.");
            } finally {
                btn.innerHTML = originalText;
                btn.disabled = false;
                lucide.createIcons();
            }
        });
    </script>
</body>

</html>
